name: Update market and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF cover renderer
        run: python -m pip install PyMuPDF==1.26.6
      - name: Build PDF list automatically
        run: python scripts/build_reports.py
      - name: Set market cache date
        id: cache-date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore market and news snapshots
        uses: actions/cache/restore@v4
        with:
          path: dist/data
          key: defi-data-v2-${{ steps.cache-date.outputs.day }}-${{ github.run_id }}
          restore-keys: |
            defi-data-v2-${{ steps.cache-date.outputs.day }}-
            defi-data-v2-
      - name: Collect council resources and apply editorial tags
        run: python scripts/update_resources.py
      - name: Fetch CoinGecko data
        continue-on-error: true
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINGECKO_PLAN: ${{ vars.COINGECKO_PLAN }}
        run: python scripts/update_market.py
      - name: Save market and news snapshots
        uses: actions/cache/save@v4
        with:
          path: dist/data
          key: defi-data-v2-${{ steps.cache-date.outputs.day }}-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
